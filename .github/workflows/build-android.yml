name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

# Default GITHUB_TOKEN needs explicit write permission to create releases
# and upload assets. Without this, `gh release create` returns HTTP 403
# "Resource not accessible by integration".
permissions:
  contents: write

jobs:
  build:
    name: Build Debug + Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history → daftar commit di catatan rilis otomatis

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # SDK sudah preinstalled di runner ubuntu-latest (ANDROID_HOME=/usr/local/lib/android/sdk,
      # sdkmanager ada di PATH). Action android-actions/setup-android tidak dipakai karena
      # menjalankan `sdkmanager tools` — paket 'tools' sudah dihapus dari repo Android SDK.
      - name: Install SDK platforms & build-tools
        run: |
          # sdkmanager tidak otomatis di PATH runner — pakai full path preinstalled
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          command -v sdkmanager || ls "$ANDROID_HOME/cmdline-tools/"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Unit test JVM (FilenameUtils + CryptoUtils)
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APKs
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/saatiril-andro-debug.apk
          RELEASE_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -n "$RELEASE_APK" ]; then
            cp "$RELEASE_APK" artifacts/saatiril-andro.apk
          else
            echo "No release APK found"
          fi
          ls -lh artifacts/

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: saatiril-andro-android-debug
          path: artifacts/saatiril-andro-debug.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: saatiril-andro-android-release
          path: artifacts/saatiril-andro.apk
          if-no-files-found: warn
          retention-days: 90

      - name: Publish to GitHub Releases (branch push → 'latest')
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ASSETS=""
          if [ -f artifacts/saatiril-andro.apk ]; then
            ASSETS="artifacts/saatiril-andro.apk artifacts/saatiril-andro-debug.apk"
          else
            ASSETS="artifacts/saatiril-andro-debug.apk"
          fi
          echo "Assets to publish: $ASSETS"

          # --- Catatan rilis otomatis: commit terbaru + checksum ---
          BUILD_DATE=$(date -u '+%Y-%m-%d %H:%M UTC')
          NOTES_FILE=/tmp/release-notes.md
          {
            echo "## Build otomatis — ${GITHUB_SHA::7}"
            echo
            echo "- **Waktu build**: ${BUILD_DATE}"
            echo "- **Commit**: [\`${GITHUB_SHA::7}\`](https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}) — $(git log -1 --pretty=%s)"
            echo
            echo "### Commit sejak rilis tag terakhir"
            echo
            LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
            if [ -n "$LAST_TAG" ]; then
              echo "\`\`\`"
              git log --oneline "${LAST_TAG}..HEAD" | head -15
              echo "\`\`\`"
            else
              echo "\`\`\`"
              git log --oneline | head -15
              echo "\`\`\`"
            fi
            echo
            echo "### Checksum (SHA-256)"
            echo
            echo "\`\`\`"
            (cd artifacts && sha256sum *.apk)
            echo "\`\`\`"
            echo
            echo "---"
            echo
            echo "**Link unduh permanen** (selalu build terbaru setiap ada update):"
            echo
            echo "- [\`saatiril-andro.apk\`](https://github.com/${GITHUB_REPOSITORY}/releases/download/latest/saatiril-andro.apk) — release (R8, lebih kecil)"
            echo "- [\`saatiril-andro-debug.apk\`](https://github.com/${GITHUB_REPOSITORY}/releases/download/latest/saatiril-andro-debug.apk) — debug"
          } > "$NOTES_FILE"

          gh release create latest \
            --title "Saatiril PTP - Latest Build" \
            --notes-file "$NOTES_FILE" \
            --prerelease --target main $ASSETS 2>/tmp/create.err || true

          if grep -q "already exists" /tmp/create.err 2>/dev/null; then
            echo "Release 'latest' sudah ada — upload aset dengan --clobber + update catatan"
            gh release upload latest $ASSETS --clobber
            gh release edit latest --notes-file "$NOTES_FILE" || true
          else
            cat /tmp/create.err 2>/dev/null || true
            gh release upload latest $ASSETS --clobber 2>/dev/null || true
          fi

          echo "=== Release assets ==="
          gh release view latest --json assets -q '.assets[].name' || true

      - name: Publish to GitHub Releases (tag → release permanen)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          ASSETS=""
          if [ -f artifacts/saatiril-andro.apk ]; then
            ASSETS="artifacts/saatiril-andro.apk artifacts/saatiril-andro-debug.apk"
          else
            ASSETS="artifacts/saatiril-andro-debug.apk"
          fi

          NOTES_FILE=/tmp/release-notes.md
          {
            echo "## Saatiril PTP ${TAG}"
            echo
            echo "DSLR USB PTP tether untuk SAATIRIL — build ${GITHUB_SHA::7} (\`$(git log -1 --pretty=%s)\`)."
            echo
            echo "### Checksum (SHA-256)"
            echo
            echo "\`\`\`"
            (cd artifacts && sha256sum *.apk)
            echo "\`\`\`"
            echo
            echo "---"
            echo
            echo "Build terbaru di antara rilis resmi: [release \`latest\`](https://github.com/${GITHUB_REPOSITORY}/releases/tag/latest) — [unduh APK release](https://github.com/${GITHUB_REPOSITORY}/releases/download/latest/saatiril-andro.apk)."
          } > "$NOTES_FILE"

          gh release create "$TAG" \
            --title "Saatiril PTP $TAG" \
            --notes-file "$NOTES_FILE" \
            $ASSETS
